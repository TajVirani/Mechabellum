// Game bridge protocol v1: the MechaBridge mod (inside the game), the mecha CLI and the website.
//
// Transport: a WebSocket server hosted by the mod on ws://127.0.0.1:<port>/ (default 17615).
// Every WebSocket binary frame holds exactly one Envelope.
//
// Requests and replies: the client picks a nonzero `id`; the mod answers with an Envelope carrying
// the same `id` and either the matching reply or `error`. Envelopes with `id` 0 are events pushed
// by the mod; clients ignore event types they do not know.
//
// Compatibility: fields are only ever added. Field numbers are never reused or renumbered.
syntax = "proto3";

package mechabellum.bridge.v1;

option csharp_namespace = "MechaBridge.Protocol";

message Envelope {
  uint64 id = 1;
  oneof body {
    Error error = 2;

    StatusRequest status_request = 10;
    StatusReply status_reply = 11;

    ListCompetitionsRequest list_competitions_request = 20;
    ListCompetitionsReply list_competitions_reply = 21;
    CompetitionPageRequest competition_page_request = 22;
    CompetitionPageReply competition_page_reply = 23;

    DownloadReplayRequest download_replay_request = 30;
    DownloadReplayReply download_replay_reply = 31;

    PersonalHistoryRequest personal_history_request = 40;
    PersonalHistoryReply personal_history_reply = 41;
  }
  // Field numbers 100 and up are reserved for live game events. They will carry MatchSnapshot v2
  // (contracts/match-snapshot/v2), not a schema of their own; see docs/data-sources.md.
}

message Error {
  // Stable machine-readable code: "invalid_request", "not_online", "timeout", "game_error", "busy".
  string code = 1;
  string message = 2;
}

message StatusRequest {}

message StatusReply {
  uint32 protocol_version = 1;
  string mod_version = 2;
  // Application.version, e.g. "2.0.0.5.2340": the game version, then the replay format. Same shape as
  // the prefix of a replay path and the name of the folder downloaded replays are saved in.
  string game_version = 3;
  bool online = 4;
  // FileUtility.ReplayDirectoryFullPath, where the game saves replays.
  string replay_directory = 5;
  // Minimum time the mod waits between requests it sends to the game's servers.
  uint32 server_request_interval_ms = 6;
}

// Past tournaments (the game calls them competitions), one page of the in-game history list.
message ListCompetitionsRequest {
  // 1-based.
  int32 page = 1;
}

message ListCompetitionsReply {
  int32 page = 1;
  int32 page_count = 2;
  repeated Competition competitions = 3;
}

message Competition {
  int32 id = 1;
  // Unix seconds.
  int64 start_time = 2;
  repeated int32 sub_ids = 3;
  // Whether the tournament came from the history list or from the recent list (ended mini tournaments).
  CompetitionSource source = 4;
}

enum CompetitionSource {
  COMPETITION_SOURCE_UNSPECIFIED = 0;
  COMPETITION_SOURCE_HISTORY = 1;
  COMPETITION_SOURCE_RECENT = 2;
}

// One page of a tournament bracket's ranking, which lists every round each team played.
message CompetitionPageRequest {
  int32 competition_id = 1;
  int32 sub_id = 2;
  // 1-based.
  int32 page = 3;
}

message CompetitionPageReply {
  int32 competition_id = 1;
  int32 sub_id = 2;
  int32 page = 3;
  int32 page_count = 4;
  // The game's bracket state; 5 means ended.
  int32 state = 5;
  // Server replay paths "<game version>/<numeric id>.rep", deduplicated, in the order the page lists them.
  repeated string replay_paths = 6;
  // Who won each listed replay, from the ranking's round records. Replays downloaded from the server
  // leave the final teamRanks empty, so this is the only record of the result.
  repeated ReplayResult results = 7;
}

message ReplayResult {
  string replay_path = 1;
  // The players' user ids, the same ids a replay's PlayerRecord lists. 0 when the page does not say.
  uint64 winner_user_id = 2;
  uint64 loser_user_id = 3;
}

message DownloadReplayRequest {
  // A replay path from CompetitionPageReply.
  string replay_path = 1;
}

message DownloadReplayReply {
  string replay_path = 1;
  // Absolute path of the .rep.grbr the game saved.
  string file_path = 2;
  // False when the file already existed and nothing was downloaded.
  bool downloaded = 3;
}

// The player's own match history, the list the game shows on the profile's power record tab. It is the
// game's PowerRecordProxy.RequestFPDetail, which takes no arguments: the server decides how many records
// come back. There is no battle id, so a record is matched to a replay by its players, map and time.
message PersonalHistoryRequest {}

message PersonalHistoryReply {
  repeated PersonalMatch matches = 1;
}

// One Protos.Common.FightRecord, with its raw values. `win` and `index` are passed on as the game sends
// them because what `win` holds is not confirmed: either the winning side's player index (compare with
// the players' `index`), or a flag that the player owning the record (the one at `index`) won.
message PersonalMatch {
  // FightRecord.Time, believed to be Unix seconds.
  int64 time = 1;
  int32 map_id = 2;
  // FightRecord.Reason, an EFightReason value; reason_name is its name, such as "ReasonNormal" or "GiveUp".
  int32 reason = 3;
  string reason_name = 4;
  // FightRecord.Point (power change) and EloPoint (rating change).
  int32 point = 5;
  int32 elo_point = 6;
  bool is_placement_match = 7;
  int32 season = 8;
  bool is_fun = 9;
  PersonalMatchKind kind = 10;
  // LobbyRecord or MatchRecord Win and Index; ChaosFactionRecord has Rank instead of Win.
  int32 win = 11;
  int32 index = 12;
  int32 rank = 13;
  // MatchRecord Id and Round: the tournament and its round.
  int32 competition_id = 14;
  int32 competition_round = 15;
  repeated PersonalMatchPlayer players = 16;
  // The player whose index equals `index`; 0 when none or several do.
  uint64 my_user_id = 17;
  // The winner, set only for two-player records where both readings of `win` name the same player
  // (that is, when the record's own index is not 0). 0 otherwise.
  uint64 winner_user_id = 18;
}

enum PersonalMatchKind {
  PERSONAL_MATCH_KIND_UNSPECIFIED = 0;
  PERSONAL_MATCH_KIND_LOBBY = 1;
  PERSONAL_MATCH_KIND_COMPETITION = 2;
  PERSONAL_MATCH_KIND_LEVEL = 3;
  PERSONAL_MATCH_KIND_COURSE = 4;
  PERSONAL_MATCH_KIND_CHAOS_FACTION = 5;
}

message PersonalMatchPlayer {
  uint64 user_id = 1;
  int32 index = 2;
  string name = 3;
}
